<div class="flex gap-6 items-start">
  <!-- Left column: event list -->
  <div
    class="w-72 shrink-0 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden"
  >
    <bfd-event-list
      [events]="visibleEvents()"
      [selectedId]="selectedEventId()"
      [showPast]="showPast()"
      (eventSelected)="selectEvent($event)"
      (togglePast)="togglePast()"
    />
  </div>

  <!-- Right column: event detail -->
  <div class="flex-1 min-w-0">
    @if (selectedEventDetail(); as detail) {
      <bfd-event-detail
        [event]="detail"
        (addRecipe)="openAddDrawer()"
        (editRecipe)="openEditDrawer($event)"
        (removeRecipe)="removeRecipe($event)"
      />
    } @else {
      <div
        class="flex flex-col items-center justify-center gap-3 py-24 text-gray-400 dark:text-gray-600"
        role="status"
      >
        <svg lucideCalendar [size]="40" aria-hidden="true"></svg>
        <p class="text-sm">Sélectionnez une soirée pour voir les détails</p>
      </div>
    }
  </div>
</div>

<!-- Recipe drawer (fixed overlay) -->
<bfd-recipe-drawer
  [mode]="drawerMode()"
  [availableRecipes]="availableRecipes()"
  [editingRecipe]="editingRecipe()"
  (save)="saveRecipe($event)"
  (cancel)="closeDrawer()"
/>
