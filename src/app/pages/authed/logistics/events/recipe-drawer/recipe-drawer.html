@if (isOpen()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="presentation">
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-black/40" aria-hidden="true" (click)="onCancel()"></div>

    <!-- Modal -->
    <div
      #drawerPanel
      role="dialog"
      [attr.aria-label]="
        mode() === 'add' ? 'Ajouter une recette à la soirée' : 'Modifier la recette'
      "
      aria-modal="true"
      tabindex="-1"
      class="relative w-full max-w-md bg-white dark:bg-gray-900 rounded-xl shadow-2xl flex flex-col max-h-[90vh] focus:outline-none"
    >
      <!-- Header -->
      <div
        class="flex items-center justify-between px-5 py-4 border-b border-gray-200 dark:border-gray-700"
      >
        <h2 class="font-semibold text-gray-900 dark:text-gray-100">
          {{ mode() === 'add' ? 'Ajouter une recette' : 'Modifier la recette' }}
        </h2>
        <button
          type="button"
          (click)="onCancel()"
          aria-label="Fermer"
          class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
        >
          <svg lucideX [size]="18" aria-hidden="true"></svg>
        </button>
      </div>

      <!-- Content -->
      <div class="flex-1 overflow-y-auto p-5 flex flex-col gap-5">
        <!-- Recipe selector (add mode) or read-only name (edit mode) -->
        @if (mode() === 'add') {
          <div class="flex flex-col gap-2">
            <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Recette</p>
            <label class="relative">
              <span class="sr-only">Rechercher une recette</span>
              <svg
                lucideSearch
                [size]="15"
                class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
                aria-hidden="true"
              ></svg>
              <input
                type="search"
                placeholder="Rechercher..."
                (input)="onSearch($event)"
                class="w-full pl-8 pr-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100 placeholder:text-gray-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
              />
            </label>
            <ul
              class="flex flex-col gap-1 max-h-52 overflow-y-auto rounded-lg border border-gray-200 dark:border-gray-700"
              aria-label="Recettes disponibles"
            >
              @for (recipe of filteredRecipes(); track recipe.id) {
                <li>
                  <button
                    type="button"
                    [attr.aria-pressed]="selectedRecipeId() === recipe.id ? 'true' : 'false'"
                    (click)="selectRecipe(recipe.id)"
                    [class]="
                      selectedRecipeId() === recipe.id
                        ? 'w-full text-left px-3 py-2 bg-violet-50 dark:bg-violet-900/20 text-violet-700 dark:text-violet-300 text-sm font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-violet-500'
                        : 'w-full text-left px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-violet-500'
                    "
                  >
                    <div class="font-medium">{{ recipe.name }}</div>
                    <div class="text-xs text-gray-400">{{ recipe.category }}</div>
                  </button>
                </li>
              } @empty {
                <li class="px-3 py-5 text-center text-sm text-gray-400">Aucune recette trouvée</li>
              }
            </ul>
          </div>
        } @else {
          <div class="flex flex-col gap-1">
            <p class="text-sm font-medium text-gray-700 dark:text-gray-300">Recette</p>
            <p
              class="text-sm text-gray-900 dark:text-gray-100 px-3 py-2 bg-gray-50 dark:bg-gray-800 rounded-lg"
            >
              {{ editingRecipe()?.recipeName ?? '' }}
            </p>
          </div>
        }

        <!-- Servings input -->
        <div class="flex flex-col gap-2">
          <label for="drawer-servings" class="text-sm font-medium text-gray-700 dark:text-gray-300">
            Nombre de personnes
          </label>
          <input
            id="drawer-servings"
            type="number"
            min="1"
            [value]="servings()"
            (input)="onServingsChange($event)"
            class="w-full px-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
          />
        </div>
      </div>

      <!-- Footer -->
      <div class="px-5 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-2">
        <button
          type="button"
          (click)="onCancel()"
          class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
        >
          Annuler
        </button>
        <button
          type="button"
          (click)="onSave()"
          [disabled]="mode() === 'add' && selectedRecipeId() === null"
          class="px-4 py-2 text-sm font-medium text-white bg-violet-500 dark:bg-violet-600 hover:opacity-90 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
        >
          Enregistrer
        </button>
      </div>
    </div>
  </div>
}
