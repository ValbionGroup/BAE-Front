<div class="flex flex-col h-full">
  <!-- Tab toggle -->
  <div class="p-3 border-b border-gray-200 dark:border-gray-700">
    <div
      class="flex gap-1 p-1 bg-gray-100 dark:bg-gray-800 rounded-lg"
      role="tablist"
      aria-label="Soirées à venir ou passées"
    >
      <button
        #upcomingTab
        type="button"
        role="tab"
        [attr.aria-selected]="!showPast() ? 'true' : 'false'"
        (click)="setShowPast(false)"
        (keydown.ArrowRight)="focusPastTab()"
        [class]="
          !showPast()
            ? 'flex-1 px-3 py-1.5 rounded-md text-sm font-medium bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500'
            : 'flex-1 px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500'
        "
      >
        À venir
      </button>
      <button
        #pastTab
        type="button"
        role="tab"
        [attr.aria-selected]="showPast() ? 'true' : 'false'"
        (click)="setShowPast(true)"
        (keydown.ArrowLeft)="focusUpcomingTab()"
        [class]="
          showPast()
            ? 'flex-1 px-3 py-1.5 rounded-md text-sm font-medium bg-white dark:bg-gray-700 text-gray-900 dark:text-gray-100 shadow-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500'
            : 'flex-1 px-3 py-1.5 rounded-md text-sm font-medium text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500'
        "
      >
        Passées
      </button>
    </div>
  </div>

  <!-- List -->
  <nav aria-label="Liste des soirées" class="flex-1 overflow-y-auto">
    @if (events().length === 0) {
      <div
        class="flex flex-col items-center gap-2 py-10 text-gray-400 dark:text-gray-600"
        role="status"
      >
        <svg lucideCalendar [size]="28" aria-hidden="true"></svg>
        <p class="text-sm">Aucune soirée {{ showPast() ? 'passée' : 'à venir' }}</p>
      </div>
    }
    @for (event of events(); track event.id) {
      <button
        type="button"
        (click)="selectEvent(event.id)"
        [attr.aria-pressed]="selectedId() === event.id"
        [class]="
          selectedId() === event.id
            ? 'w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700/50 bg-violet-50 dark:bg-violet-900/20 border-l-2 border-l-violet-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-violet-500'
            : 'w-full text-left px-4 py-3 border-b border-gray-100 dark:border-gray-700/50 hover:bg-gray-50 dark:hover:bg-gray-700/30 border-l-2 border-l-transparent focus:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-violet-500'
        "
      >
        <div class="flex items-center justify-between gap-2">
          <span class="font-medium text-sm text-gray-900 dark:text-gray-100 truncate">{{
            event.name
          }}</span>
          @if (event.recipeCount > 0) {
            <span
              class="shrink-0 inline-flex items-center justify-center w-5 h-5 rounded-full bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-400 text-xs font-semibold"
              [attr.aria-label]="event.recipeCount + ' recette(s)'"
              >{{ event.recipeCount }}</span
            >
          }
        </div>
        <p class="text-xs text-gray-400 mt-0.5">{{ formatDate(event.date) }}</p>
      </button>
    }
  </nav>
</div>
