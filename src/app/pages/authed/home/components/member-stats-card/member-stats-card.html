<section
  class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-6"
  aria-label="Mes statistiques"
>
  <div class="flex items-center gap-2 mb-4">
    <svg lucideStar [size]="16" class="text-amber-500" aria-hidden="true" />
    <h2 class="font-semibold text-gray-900 dark:text-gray-100 text-sm">Mes points</h2>
  </div>

  <div class="flex items-baseline gap-1.5 mb-5">
    <span class="text-4xl font-bold text-amber-500 tabular-nums">{{ member().points }}</span>
    <span class="text-sm text-gray-500 dark:text-gray-400 font-medium">pts</span>
  </div>

  <div>
    <p class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide mb-2">
      Activite recente
    </p>
    <ul class="space-y-2" aria-label="Activite recente">
      @for (activity of recentActivity; track activity.label) {
        <li class="flex items-center justify-between gap-2 text-sm">
          <span class="text-gray-600 dark:text-gray-400 truncate">{{ activity.label }}</span>
          <span class="text-emerald-600 dark:text-emerald-400 font-medium tabular-nums shrink-0">
            +{{ activity.points }} pts
          </span>
        </li>
      }
    </ul>
  </div>
</section>
