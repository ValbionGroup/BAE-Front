<section
  class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-6"
  aria-label="Soiree en cours"
>
  <!-- Event header -->
  <div class="flex items-start justify-between gap-3 mb-1">
    <div class="min-w-0">
      <p class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wide mb-1 inline-flex items-center gap-2">
        <span class="relative flex h-2 w-2" aria-hidden="true">
          <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 animate-ping"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
        </span>
        Soiree en cours
      </p>
      <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100">
        {{ event().event.name }}
      </h2>
    </div>

    <!-- Station badge -->
    @if (station(); as role) {
      <span
        class="shrink-0 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-violet-100 dark:bg-violet-900/40 text-violet-700 dark:text-violet-300 border border-violet-200 dark:border-violet-800/60"
        [attr.aria-label]="'Ton poste : ' + role.name"
      >
        <svg [lucideIcon]="role.icon" [size]="12" aria-hidden="true" />
        {{ role.name }}
      </span>
    }
  </div>

  <!-- Date & Location -->
  <div class="flex flex-col gap-1.5 mb-5">
    <div class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
      <svg lucideCalendar [size]="14" aria-hidden="true" class="shrink-0" />
      <span class="capitalize">{{ formatDate(event().event.date) }}</span>
    </div>
    <div class="flex items-center gap-2 text-sm text-gray-600 dark:text-gray-400">
      <svg lucideMapPin [size]="14" aria-hidden="true" class="shrink-0" />
      <span>{{ event().location }}</span>
    </div>
  </div>

  <!-- Order tracker stats -->
  <div class="mb-5">
    <p class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide mb-2">
      Suivi des commandes
    </p>
    <bfd-order-tracker-stats />
  </div>

  <!-- Menu -->
  <div class="mb-5">
    <p class="text-xs font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide mb-2">
      Menu du soir
    </p>
    <bfd-menu-overview [items]="menuItems()" />
  </div>

  <!-- CTA -->
  <div>
    <a
      routerLink="/orders/kitchen"
      class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-violet-500 dark:bg-violet-600 text-white text-sm font-medium hover:opacity-90 transition-opacity focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
      aria-label="Ouvrir l ecran cuisine"
    >
      <svg lucideMonitor [size]="16" aria-hidden="true" />
      Ouvrir l ecran cuisine
    </a>
  </div>
</section>
