<div class="grid grid-cols-3 gap-3" role="group" aria-label="Statistiques des commandes">
  <!-- En attente / En cours / Prêt -->
  <div
    class="flex flex-col items-center justify-center rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-800/60 px-3 py-4 gap-1"
    role="status"
    aria-label="Commandes en cours"
  >
    <span class="text-3xl font-bold tabular-nums text-amber-600 dark:text-amber-400" aria-live="polite">
      {{ activeCount() }}
    </span>
    <span class="text-xs font-medium text-amber-700 dark:text-amber-300 text-center leading-tight">En attente</span>
  </div>

  <!-- Terminées -->
  <div
    class="flex flex-col items-center justify-center rounded-xl bg-emerald-50 dark:bg-emerald-950/30 border border-emerald-200 dark:border-emerald-800/60 px-3 py-4 gap-1"
    role="status"
    aria-label="Commandes terminées"
  >
    <span class="text-3xl font-bold tabular-nums text-emerald-600 dark:text-emerald-400" aria-live="polite">
      {{ completedCount() }}
    </span>
    <span class="text-xs font-medium text-emerald-700 dark:text-emerald-300 text-center leading-tight">Terminées</span>
  </div>

  <!-- Annulées -->
  <div
    class="flex flex-col items-center justify-center rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-200 dark:border-red-800/60 px-3 py-4 gap-1"
    role="status"
    aria-label="Commandes annulées"
  >
    <span class="text-3xl font-bold tabular-nums text-red-600 dark:text-red-400" aria-live="polite">
      {{ cancelledCount() }}
    </span>
    <span class="text-xs font-medium text-red-700 dark:text-red-300 text-center leading-tight">Annulées</span>
  </div>
</div>
