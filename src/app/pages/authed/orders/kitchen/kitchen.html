<main class="p-6 md:p-8 flex flex-col gap-6 min-h-full">
  <header class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-100">Écran cuisine</h1>
      @if (event(); as ev) {
        <p class="text-gray-600 dark:text-gray-400">{{ ev.event.name }} · {{ formatDate(ev.event.date) }}</p>
      }
    </div>
    <div class="text-3xl font-mono tabular-nums text-gray-700 dark:text-gray-300" aria-live="off" aria-label="Heure actuelle">
      {{ clock() }}
    </div>
  </header>

  @if (event(); as ev) {
    <bfd-kds-toolbar [filter]="filter()" (filterChange)="filter.set($event)" />

    <section
      class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"
      aria-label="Commandes en cours"
    >
      @for (order of visibleOrders(); track order.id) {
        <bfd-order-card
          [order]="order"
          (advance)="onAdvance($event)"
          (cancel)="onCancel($event)"
        />
      } @empty {
        <p class="col-span-full text-center text-gray-500 dark:text-gray-400 py-12">
          Aucune commande pour le moment.
        </p>
      }
    </section>
  } @else {
    <div class="flex flex-col items-center justify-center py-16 text-center gap-3">
      <p class="text-lg text-gray-700 dark:text-gray-300">Aucun événement actif.</p>
      <a
        routerLink="/"
        class="text-violet-600 dark:text-violet-400 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 rounded"
      >
        Retour à l'accueil
      </a>
    </div>
  }
</main>
