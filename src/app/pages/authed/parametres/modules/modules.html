<div class="h-full overflow-y-auto px-6 pt-5 pb-10">
  <div class="grid grid-cols-[220px_1fr] gap-7">
    <bfd-parametres-side-nav />

    <div class="max-w-[760px]">
      <bfd-card class="bg-warn-soft border-warn mb-[18px] block">
        <div class="flex gap-2.5 items-start">
          <svg [lucideIcon]="icAlert" [size]="16" class="text-warn mt-0.5"></svg>
          <div class="flex-1">
            <div class="text-[12.5px] text-text font-semibold">Zone sensible</div>
            <div class="text-[11.5px] text-text-2 mt-1 leading-relaxed">
              Désactiver un module masque sa section pour toute l'équipe. Chaque action est tracée
              dans l'audit log. Seule la Présidence peut basculer ces options.
            </div>
          </div>
        </div>
      </bfd-card>

      @for (m of modules; track m.k) {
        <div class="p-4 bg-surface border border-border-s rounded-lg mb-2.5">
          <div class="flex items-start gap-3.5">
            <div
              [class]="
                'w-[42px] h-[42px] rounded-md bg-surface-2 border border-border-s inline-flex items-center justify-center ' +
                (m.on ? 'text-blue' : 'text-muted')
              "
            >
              <svg [lucideIcon]="icZap" [size]="18" aria-hidden="true"></svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-sm font-semibold text-text">{{ m.n }}</span>
                @if (m.beta) {
                  <bfd-badge kind="blue">BÊTA</bfd-badge>
                }
                <bfd-badge kind="neutral">{{ m.role }}</bfd-badge>
              </div>
              <div class="text-[11.5px] text-muted mt-1 leading-relaxed">{{ m.desc }}</div>
            </div>
            <bfd-toggle [on]="m.on" />
          </div>
        </div>
      }
    </div>
  </div>
</div>
