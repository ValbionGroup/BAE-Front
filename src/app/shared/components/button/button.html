<button
  (click)="action()"
  type="button"
  class="flex items-center gap-2 px-4 py-2 rounded-lg bg-violet-500 dark:bg-violet-600 text-white text-sm font-medium hover:opacity-90 transition-opacity focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 shrink-0"
>
  @if (icon()) {
    <svg [lucideIcon]="icon()" [size]="16" aria-hidden="true"></svg>
  }
  <span>{{ label() }}</span>
</button>
