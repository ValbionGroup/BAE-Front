<span class="sr-only">{{ hint() }}</span>
<svg
  lucideSearch
  [size]="16"
  class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"
  aria-hidden="true"
></svg>
<input
  type="search"
  [placeholder]="hint()"
  (input)="search.emit($event)"
  class="w-full pl-9 pr-4 py-2 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 text-sm placeholder:text-gray-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
/>
