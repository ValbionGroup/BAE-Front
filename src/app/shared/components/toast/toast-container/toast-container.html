<div class="fixed bottom-4 right-4 z-[60] flex flex-col-reverse gap-2 w-80" role="status" aria-live="polite" aria-atomic="false">
  @for (toast of toasts(); track toast.id) {
    <div
      [class]="'flex items-start gap-3 p-4 rounded-xl border shadow-lg ' + typeClasses[toast.type].card"
      [attr.role]="toast.type === 'error' ? 'alert' : null"
      [attr.aria-live]="toast.type === 'error' ? 'assertive' : null"
    >
      <span [class]="'mt-1.5 w-2 h-2 rounded-full shrink-0 ' + typeClasses[toast.type].dot"></span>
      <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ toast.title }}</p>
        @if (toast.message) {
          <p class="text-xs text-gray-600 dark:text-gray-400 mt-0.5 leading-relaxed">{{ toast.message }}</p>
        }
        @if (hasDuration(toast)) {
          <div class="mt-2 h-0.5 rounded-full bg-gray-200 dark:bg-gray-700 overflow-hidden">
            <div [class]="'h-full origin-left ' + typeClasses[toast.type].bar" [style.animation]="animationStyle(toast)"></div>
          </div>
        }
      </div>
      <button
        type="button"
        (click)="dismiss(toast.id)"
        [attr.aria-label]="'Fermer: ' + toast.title"
        class="shrink-0 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200"
      >
        <svg lucideX [size]="14" aria-hidden="true"></svg>
      </button>
    </div>
  }
</div>
