<div
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'modal-title-' + config().id"
  tabindex="-1"
  class="w-full max-w-md bg-white dark:bg-gray-900 rounded-xl shadow-2xl flex flex-col max-h-[90vh] focus:outline-none"
>
  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 dark:border-gray-700">
    <div class="flex items-center gap-3">
      <span [class]="'p-1.5 rounded-lg ' + meta().iconBg">
        <svg [lucideIcon]="meta().icon" [size]="18" [class]="meta().iconClass" aria-hidden="true"></svg>
      </span>
      <h2 [id]="'modal-title-' + config().id" class="text-sm font-semibold text-gray-900 dark:text-gray-100">
        {{ config().title }}
      </h2>
    </div>
    <button
      type="button"
      (click)="onClose()"
      aria-label="Fermer"
      class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
    >
      <svg lucideX [size]="16" aria-hidden="true"></svg>
    </button>
  </div>

  <div class="px-5 py-4 flex flex-col gap-3 overflow-y-auto">
    <p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">{{ config().message }}</p>
    @if (config().details) {
      <button
        type="button"
        (click)="toggleDetails()"
        class="text-xs text-left text-violet-600 dark:text-violet-400 self-start focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500 rounded"
      >
        {{ showDetails() ? '▾ Masquer les détails' : '▸ Afficher les détails' }}
      </button>
      @if (showDetails()) {
        <pre class="text-xs text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg p-3 overflow-x-auto whitespace-pre-wrap break-all font-mono">{{ config().details }}</pre>
      }
    }
  </div>

  <div class="px-5 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-2">
    @for (a of actions(); track $index) {
      @if (a.variant === 'primary') {
        <button
          type="button"
          (click)="onAction(a.action)"
          class="px-4 py-2 text-sm font-medium text-white bg-violet-500 dark:bg-violet-600 hover:opacity-90 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
        >{{ a.label }}</button>
      } @else {
        <button
          type="button"
          (click)="onAction(a.action)"
          class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-violet-500"
        >{{ a.label }}</button>
      }
    }
  </div>
</div>
