<div
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="'modal-title-' + config().id"
  tabindex="-1"
  class="w-full max-w-md bg-white dark:bg-gray-900 rounded-xl shadow-2xl flex flex-col max-h-[90vh] focus:outline-none"
>
  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-200 dark:border-gray-700">
    <div class="flex items-center gap-3">
      <span class="p-1.5 rounded-lg bg-red-50 dark:bg-red-500/10">
        <svg lucideTrash2 [size]="18" class="text-red-500" aria-hidden="true"></svg>
      </span>
      <h2 [id]="'modal-title-' + config().id" class="text-sm font-semibold text-gray-900 dark:text-gray-100">
        {{ config().title }}
      </h2>
    </div>
    <button
      type="button"
      (click)="onClose()"
      aria-label="Fermer"
      class="p-1.5 rounded-md text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
    >
      <svg lucideX [size]="16" aria-hidden="true"></svg>
    </button>
  </div>

  <div class="px-5 py-4 flex flex-col gap-3 overflow-y-auto">
    <p class="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">{{ config().message }}</p>

    @if (config().confirmationText) {
      <div class="flex flex-col gap-1.5">
        <p class="text-xs font-medium text-gray-700 dark:text-gray-300">
          Tapez <span class="font-mono font-semibold text-red-500">{{ config().confirmationText }}</span> pour confirmer
        </p>
        <input
          type="text"
          [attr.aria-label]="'Confirmez en tapant: ' + config().confirmationText"
          (input)="onTyped($event)"
          class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-gray-100 placeholder-gray-400 focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
        />
      </div>
    }
  </div>

  <div class="px-5 py-4 border-t border-gray-200 dark:border-gray-700 flex justify-end gap-2">
    <button
      type="button"
      (click)="onClose()"
      class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500"
    >
      Annuler
    </button>
    <button
      type="button"
      (click)="onConfirm()"
      [disabled]="!canConfirm()"
      class="px-4 py-2 text-sm font-medium text-white bg-red-500 hover:opacity-90 rounded-lg focus:outline-none focus-visible:ring-2 focus-visible:ring-red-500 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      Supprimer
    </button>
  </div>
</div>
