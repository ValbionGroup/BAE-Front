<bfd-modal-shell
  tone="blue"
  [icon]="icCalendar"
  eyebrow="COORDINATION · NOUVELLE SOIRÉE"
  title="Planifier une soirée"
  subtitle="Étape 1/3 · informations générales"
  [width]="700"
  (close)="close()"
>
  <bfd-field label="Nom de la soirée *">
    <bfd-input placeholder="ex. Soirée Saint-Patrick" />
  </bfd-field>

  <bfd-field label="Type" class="block mt-3.5">
    <div class="grid grid-cols-4 gap-2">
      @for (o of types; track o.key) {
        <button
          type="button"
          (click)="selectedType.set(o.key)"
          [class]="
            'text-left p-3 rounded-md cursor-pointer border-[1.5px] ' +
            (o.key === selectedType() ? 'bg-blue-soft border-blue' : 'bg-surface-2 border-border')
          "
        >
          <svg
            [lucideIcon]="o.icon"
            [size]="16"
            [class]="'mb-1.5 ' + (o.key === selectedType() ? 'text-blue' : 'text-text-2')"
            aria-hidden="true"
          ></svg>
          <div class="text-[12.5px] font-medium text-text">{{ o.l }}</div>
          <div class="text-[10.5px] text-muted mt-0.5">{{ o.desc }}</div>
        </button>
      }
    </div>
  </bfd-field>

  <div class="grid grid-cols-3 gap-3 mt-3.5">
    <bfd-field label="Date *">
      <bfd-input [icon]="icCalendar" value="17/03/2026" />
    </bfd-field>
    <bfd-field label="Début *">
      <bfd-input [icon]="icClock" value="19:30" />
    </bfd-field>
    <bfd-field label="Fin (estimée)">
      <bfd-input [icon]="icClock" value="23:30" />
    </bfd-field>
  </div>

  <div class="grid grid-cols-[1.4fr_1fr] gap-3 mt-3.5">
    <bfd-field label="Lieu *">
      <bfd-input value="Foyer ENSEIRB — Talence" />
    </bfd-field>
    <bfd-field label="Convives attendus">
      <bfd-input suffix="pers." value="180" />
    </bfd-field>
  </div>

  <bfd-field label="Responsable de soirée *" class="block mt-3.5">
    <div
      class="flex items-center gap-2.5 px-2.5 py-1.5 bg-surface-2 border border-border rounded-md"
    >
      <bfd-avatar name="Hugo Lefevre" [size]="22" />
      <span class="flex-1 text-[13px] text-text"
        >Hugo Lefevre <span class="text-muted">· Bar</span></span
      >
      <svg [lucideIcon]="icChevDown" [size]="14" class="text-muted"></svg>
    </div>
  </bfd-field>

  <bfd-field label="Description (interne)" class="block mt-3.5">
    <textarea
      class="w-full bg-surface-2 border border-border rounded-md p-2.5 text-text text-[12.5px] font-sans outline-none resize-y"
      placeholder="Notes pour l'équipe : thème, dress-code, particularités…"
      rows="2"
    ></textarea>
  </bfd-field>

  <div modal-footer class="contents">
    <bfd-btn kind="ghost" size="sm" [icon]="icCheck">Enregistrer brouillon</bfd-btn>
    <div class="flex-1"></div>
    <div class="flex gap-1 mr-2.5">
      <span class="w-[22px] h-1 rounded-sm bg-blue"></span>
      <span class="w-[22px] h-1 rounded-sm bg-border"></span>
      <span class="w-[22px] h-1 rounded-sm bg-border"></span>
    </div>
    <bfd-btn kind="ghost" (clicked)="close()">Annuler</bfd-btn>
    <bfd-btn kind="primary" [iconRight]="icArrowRight" (clicked)="close()"
      >Suite · Recettes</bfd-btn
    >
  </div>
</bfd-modal-shell>
