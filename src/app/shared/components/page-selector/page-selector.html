<div class="flex space-x-4 border-b border-zinc-200 overflow-x-auto w-full">
  @for (item of pages(); track item.label) {
    <button
      [routerLink]="item.route"
      [routerLinkActive]="'!border-purple-600 !text-purple-600'"
      class="pb-4 px-2 font-medium text-sm flex items-center space-x-2 whitespace-nowrap border-b-2 border-transparent text-zinc-500 hover:text-zinc-700"
    >
      <svg [lucideIcon]="item.icon" [size]="17" />
      <span>{{ item.label }}</span>
    </button>
  }
</div>
