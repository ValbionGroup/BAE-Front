name: Build and deploy
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*-*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  create-env:
    name: Create environment file
    permissions:
      contents: read
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      # `environment.ts` vit dans la bibliothèque partagée : les deux
      # applications le lisent via `API_BASE_URL`, donc une seule génération
      # alimente les deux images.
      - name: Generate environment.ts
        env:
          API_URL: ${{ vars.BAE_API_URL }}
        run: |
          set -euo pipefail

          # nginx serves the bundle without proxying the API, so a missing URL
          # would ship an image whose every request goes nowhere.
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable BAE_API_URL is not set."
            exit 1
          fi

          mkdir -p projects/bae-ui/src/environment
          cat > projects/bae-ui/src/environment/environment.ts <<EOF
          export const environment = {
            production: true,
            apiUrl: '$API_URL',
          };
          EOF

      - name: Upload environment file
        uses: actions/upload-artifact@v4
        with:
          name: environment
          path: projects/bae-ui/src/environment/environment.ts
          retention-days: 1

  build-and-push-dashboard:
    name: Build and push dashboard image
    needs: [create-env]
    permissions:
      contents: read
      id-token: write
    uses: Eirbware/.github/.github/workflows/build-and-publish.yml@master
    with:
      file: './Dockerfile.dashboard'
      image_name: ValbionGroup/bae-front-dashboard
      artifact_name: environment
      artifact_path: projects/bae-ui/src/environment
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_api_key: ${{ secrets.registry_api_key }}

  build-and-push-public:
    name: Build and push public image
    needs: [create-env]
    permissions:
      contents: read
      id-token: write
    uses: Eirbware/.github/.github/workflows/build-and-publish.yml@master
    with:
      file: './Dockerfile.public'
      image_name: ValbionGroup/bae-front-public
      artifact_name: environment
      artifact_path: projects/bae-ui/src/environment
    secrets:
      registry_username: ${{ secrets.registry_username }}
      registry_api_key: ${{ secrets.registry_api_key }}

  deploy-dashboard:
    name: Deploy dashboard on Portainer
    needs: [build-and-push-dashboard]
    uses: Eirbware/.github/.github/workflows/deploy-stack.yml@master
    secrets:
      portainer_stack_webhook: ${{ secrets.portainer_stack_webhook }}
      wireguard_conf: ${{ secrets.wireguard_conf }}

  deploy-public:
    name: Deploy public front on Portainer
    needs: [build-and-push-public]
    uses: Eirbware/.github/.github/workflows/deploy-stack.yml@master
    secrets:
      portainer_stack_webhook: ${{ secrets.portainer_stack_webhook_public }}
      wireguard_conf: ${{ secrets.wireguard_conf }}
