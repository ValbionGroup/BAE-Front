name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  install:
    name: Install and cache dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up NodeJS and pnpm
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true
          runtime: node@lts

      - uses: actions/cache@v4
        id: pnpm-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        run: pnpm install

  test_app:
    name: Test Angular application
    runs-on: ubuntu-latest
    needs: [lint, prettier]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Set up NodeJS and pnpm
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true
          runtime: node@lts

      - name: Install Chromium
        uses: daaku/gh-action-apt-install@v4
        with:
          packages: chromium-browser
        env:
          CHROME_BIN: '/usr/bin/chromium-browser'

      - name: Create environment
        run: cp src/environment/environment.example.ts src/environment/environment.ts

      - name: Set timezone
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: 'Europe/Paris'
          timezoneMacos: 'Europe/Paris'
          timezoneWindows: 'Romance Standard Time'

      - name: Set system locale to French
        run: |
          sudo locale-gen fr_FR.UTF-8
          sudo update-locale LANG=fr_FR.UTF-8

      - name: run angular tests
        run: pnpm test --watch=false --browsers=ChromeHeadless
        env:
          LANG: fr_FR.UTF-8
          LANGUAGE: fr_FR:fr
          LC_ALL: fr_FR.UTF-8

  lint:
    name: Check code linting
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up NodeJS and pnpm
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true
          runtime: node@lts

      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Check linting
        run: pnpm lint

  prettier:
    name: Check code formatting
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up NodeJS and pnpm
        uses: pnpm/setup@v2
        with:
          install: false
          cache: true
          runtime: node@lts

      - uses: actions/cache@v4
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Check formatting
        run: pnpm format:check
