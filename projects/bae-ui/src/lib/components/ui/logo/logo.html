<div class="flex items-center gap-2.5">
  <svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="3" y="3" width="18" height="18" rx="3" fill="var(--bae-red)" opacity="0.85" />
    <circle cx="20" cy="20" r="9" fill="var(--bae-blue)" opacity="0.85" />
    <rect
      x="3"
      y="3"
      width="18"
      height="18"
      rx="3"
      fill="none"
      stroke="var(--bae-red)"
      stroke-width="0.5"
      opacity="0.6"
    />
  </svg>
  @if (showText()) {
    <div class="flex flex-col leading-none">
      <span class="text-[15px] font-bold tracking-[-0.3px] text-text"> BA'ERP </span>
      @if (version(); as v) {
        <span class="mono mt-0.75 text-[9px] tracking-[0.5px] text-muted font-mono">
          v{{ v }}
        </span>
      }
    </div>
  }
</div>
