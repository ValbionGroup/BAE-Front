<div class="flex items-center gap-2.5">
  <img
    ngSrc="/logo-bae.png"
    width="350"
    height="256"
    class="w-auto"
    [style.height.px]="size()"
    [alt]="showText() ? '' : 'BAE'"
    priority
  />
  @if (showText()) {
    <div class="flex flex-col leading-none">
      <span class="text-[15px] font-bold tracking-[-0.3px] text-text"> BA'ERP </span>
      @if (version(); as v) {
        <span class="mono mt-0.75 text-[9px] tracking-[0.5px] text-muted font-mono">
          v{{ v }}
        </span>
      }
    </div>
  }
</div>
