<bfd-modal-shell [icon]="icTag" tone="blue" [title]="title()" [width]="460" (close)="cancel()">
  <div class="flex flex-col gap-3">
    <bae-field [label]="label()">
      <bae-input
        [placeholder]="placeholder()"
        [value]="name()"
        [invalid]="submitted() && !valid()"
        (valueChange)="onName($event)"
      />
    </bae-field>

    @if (submitted() && !valid()) {
      <p class="text-[11.5px] text-danger">Le nom est obligatoire.</p>
    }

    <!-- Le refus du serveur, en toutes lettres : c'est lui qui dit pourquoi. -->
    @if (error(); as message) {
      <p class="text-[11.5px] text-danger" role="alert">{{ message }}</p>
    }

    <div class="mt-1 flex justify-end gap-2">
      <bae-btn kind="secondary" size="sm" (clicked)="cancel()">Annuler</bae-btn>
      <bae-btn kind="primary" size="sm" [disabled]="busy()" (clicked)="submit()">
        Enregistrer
      </bae-btn>
    </div>
  </div>
</bfd-modal-shell>
