<bfd-modal-shell [icon]="icTrash" tone="danger" [title]="config().title" (close)="onClose()">
  <div class="flex flex-col gap-3.5">
    <p class="text-text-2 text-[13px] leading-relaxed">{{ config().message }}</p>

    @if (config().confirmationText) {
      <div class="flex flex-col gap-1.5">
        <p class="text-xs text-muted">
          Tapez
          <span class="font-mono font-semibold text-danger">{{ config().confirmationText }}</span>
          pour confirmer
        </p>
        <input
          type="text"
          [attr.aria-label]="'Confirmez en tapant: ' + config().confirmationText"
          (input)="onTyped($event)"
          class="w-full px-3 py-2 text-[13px] border border-border rounded-md bg-surface-2 text-text placeholder-muted focus:outline-none focus-visible:ring-2 focus-visible:ring-danger/40"
        />
      </div>
    }
  </div>

  <div modal-footer class="flex flex-1 items-center justify-end gap-2">
    <bae-btn kind="ghost" size="md" (clicked)="onClose()">Annuler</bae-btn>
    <bae-btn kind="danger" size="md" [disabled]="!canConfirm()" (clicked)="onConfirm()"
      >Supprimer</bae-btn
    >
  </div>
</bfd-modal-shell>
