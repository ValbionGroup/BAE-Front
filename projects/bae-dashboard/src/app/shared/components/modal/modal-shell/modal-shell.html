<div
  role="dialog"
  aria-modal="true"
  tabindex="-1"
  class="bg-surface border border-border rounded-t-xl shadow-[0_20px_80px_rgba(0,0,0,.5)] flex w-full flex-col max-h-[100dvh] focus:outline-none md:max-h-[90vh] md:rounded-xl"
  [style.maxWidth.px]="width()"
>
  <div class="px-5.5 py-4 border-b border-border-s flex items-center gap-3.5">
    @if (icon()) {
      <span
        [class]="
          'w-9 h-9 rounded-lg shrink-0 inline-flex items-center justify-center ' +
          toneClasses().bg +
          ' ' +
          toneClasses().fg
        "
      >
        <svg [lucideIcon]="icon()!" [size]="18" aria-hidden="true"></svg>
      </span>
    }
    <div class="flex-1 min-w-0">
      <div class="text-[15px] font-semibold text-text tracking-[-0.2px]">{{ title() }}</div>
      @if (subtitle()) {
        <div class="text-xs text-muted mt-0.5">{{ subtitle() }}</div>
      }
    </div>
    <button
      type="button"
      (click)="onClose()"
      aria-label="Fermer"
      class="w-7 h-7 rounded-md inline-flex items-center justify-center text-muted hover:bg-surface-2 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-blue/40"
    >
      <svg lucideX [size]="15" aria-hidden="true"></svg>
    </button>
  </div>

  <div class="p-5.5 flex-1 overflow-y-auto">
    <ng-content />
  </div>

  <div class="px-5.5 py-3.5 border-t border-border-s flex items-center gap-2">
    <ng-content select="[modal-footer]" />
  </div>
</div>
