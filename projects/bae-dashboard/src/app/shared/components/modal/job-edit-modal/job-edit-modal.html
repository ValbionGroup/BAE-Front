<bfd-modal-shell [icon]="icJob" tone="blue" [title]="title()" [width]="520" (close)="cancel()">
  <div class="flex flex-col gap-3">
    <bae-field label="Nom du poste">
      <bae-input
        placeholder="ex. Grill"
        [value]="name()"
        [invalid]="submitted() && !valid()"
        (valueChange)="onName($event)"
      />
    </bae-field>

    @if (submitted() && !valid()) {
      <p class="text-[11.5px] text-danger">Le nom est obligatoire.</p>
    }

    <!-- `<select>` : la période est une énumération, et son vocabulaire vient
         de `JOB_PERIOD_LABELS`. -->
    <bae-field label="Période">
      <select
        class="h-9 w-full rounded-md border border-border-s bg-surface px-2 text-[12.5px] text-text focus-visible:ring-2 focus-visible:ring-blue/40"
        [value]="type()"
        (change)="onType($any($event.target).value)"
      >
        @for (period of periods; track period.value) {
          <option [value]="period.value">{{ period.label }}</option>
        }
      </select>
    </bae-field>

    <bae-field label="Description" hint="Facultative">
      <bae-input
        placeholder="ex. Allumer le charbon une heure avant"
        [value]="description()"
        (valueChange)="onDescription($event)"
      />
    </bae-field>

    @if (error(); as message) {
      <p class="text-[11.5px] text-danger" role="alert">{{ message }}</p>
    }
  </div>

  <div modal-footer class="flex flex-1 justify-end gap-2">
    <bae-btn kind="ghost" size="md" (clicked)="cancel()">Annuler</bae-btn>
    <bae-btn kind="primary" size="md" [disabled]="busy()" (clicked)="submit()">Enregistrer</bae-btn>
  </div>
</bfd-modal-shell>
