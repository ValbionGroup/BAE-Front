<bfd-modal-shell
  [icon]="icBoxes"
  tone="blue"
  [title]="title()"
  subtitle="Gobelets, serviettes, nappes — tout ce qui ne se mange pas."
  [width]="460"
  (close)="cancel()"
>
  <div class="flex flex-col gap-3">
    <bae-field label="Nom">
      <bae-input
        placeholder="Gobelet 33 cl"
        [value]="name()"
        [invalid]="submitted() && name().trim() === ''"
        (valueChange)="onName($event)"
      />
    </bae-field>

    <div class="grid grid-cols-2 gap-3">
      <bae-field label="Quantité en stock">
        <bae-input
          placeholder="0"
          [value]="quantity()"
          [invalid]="submitted() && parsedQuantity() === null"
          (valueChange)="onQuantity($event)"
        />
      </bae-field>

      <bae-field label="Prix unitaire (€)">
        <bae-input
          placeholder="0,08"
          [value]="amount()"
          [invalid]="submitted() && cents() === null"
          (valueChange)="onAmount($event)"
        />
      </bae-field>
    </div>

    @if (submitted() && !valid()) {
      <p class="text-[11.5px] text-danger">
        Il faut un nom, une quantité entière et un prix unitaire.
      </p>
    }

    <!-- Le refus du serveur, en toutes lettres : c'est lui qui dit pourquoi. -->
    @if (error(); as message) {
      <p class="text-[11.5px] text-danger" role="alert">{{ message }}</p>
    }

    <div class="mt-1 flex justify-end gap-2">
      <bae-btn kind="secondary" size="sm" (clicked)="cancel()">Annuler</bae-btn>
      <bae-btn kind="primary" size="sm" [disabled]="busy()" (clicked)="submit()">
        Enregistrer
      </bae-btn>
    </div>
  </div>
</bfd-modal-shell>
