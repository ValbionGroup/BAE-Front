<bfd-modal-shell
  [icon]="meta().icon"
  [tone]="meta().tone"
  [title]="config().title ?? ''"
  (close)="onClose()"
>
  <div class="flex flex-col gap-3.5">
    <p class="text-text-2 text-[13px] leading-relaxed">{{ config().message }}</p>
    @if (config().details) {
      <button
        type="button"
        (click)="toggleDetails()"
        class="text-xs text-left text-muted hover:text-text self-start focus:outline-none focus-visible:ring-2 focus-visible:ring-blue/40 rounded"
      >
        {{ showDetails() ? '▾ Masquer les détails' : '▸ Afficher les détails' }}
      </button>
      @if (showDetails()) {
        <pre
          class="text-xs text-text-2 bg-surface-2 border border-border-s rounded-lg p-3 overflow-x-auto whitespace-pre-wrap break-all font-mono"
          >{{ config().details }}</pre>
      }
    }
  </div>

  <div modal-footer class="flex flex-1 flex-wrap items-center justify-end gap-2">
    @for (a of actions(); track $index) {
      <bae-btn
        [kind]="a.variant === 'primary' ? 'primary' : 'ghost'"
        size="md"
        (clicked)="onAction(a.action)"
        >{{ a.label }}</bae-btn
      >
    }
  </div>
</bfd-modal-shell>
