<bfd-modal-shell [title]="config().title ?? 'Nouvelle soirée'" (close)="onClose()">
  <div class="flex flex-col gap-4">
    <p class="text-text-2 text-[13px] leading-relaxed">{{ config().message }}</p>

    <!-- En-tête de colonnes masqué sous `md` : les champs portent leur propre
         libellé une fois empilés. -->
    <div
      class="hidden grid-cols-[1fr_140px_110px] gap-2 text-[10px] font-semibold uppercase tracking-wider text-muted md:grid"
    >
      <span>Nom</span>
      <span>Date</span>
      <span>Heure</span>
    </div>

    <div
      class="flex flex-col gap-3 md:grid md:grid-cols-[1fr_140px_110px] md:items-center md:gap-2"
    >
      <label class="flex flex-col gap-1">
        <span class="text-[10px] font-semibold uppercase tracking-wider text-muted md:hidden"
          >Nom</span
        >
        <input
          type="text"
          [value]="name()"
          placeholder="Nom de la soiree"
          [class]="inputClass(name().trim().length === 0)"
          (input)="onNameInput($event)"
        />
      </label>
      <label class="flex flex-col gap-1">
        <span class="text-[10px] font-semibold uppercase tracking-wider text-muted md:hidden"
          >Date</span
        >
        <input
          type="date"
          [value]="date()"
          [class]="inputClass(date().trim().length === 0)"
          (input)="onDateInput($event)"
        />
      </label>
      <label class="flex flex-col gap-1">
        <span class="text-[10px] font-semibold uppercase tracking-wider text-muted md:hidden"
          >Heure</span
        >
        <input
          type="time"
          [value]="time()"
          [class]="inputClass(false)"
          (input)="onTimeInput($event)"
        />
      </label>
    </div>
  </div>

  <div modal-footer class="flex flex-1 items-center justify-end gap-2">
    <bae-btn kind="ghost" size="md" (clicked)="onClose()">Annuler</bae-btn>
    <bae-btn kind="primary" size="md" [disabled]="!canSave()" (clicked)="onSave()"> Creer </bae-btn>
  </div>
</bfd-modal-shell>
