<div class="rounded-lg border border-border-s bg-surface p-4">
  <div class="flex items-baseline justify-between gap-3">
    <div>
      <h2 class="text-[13px] font-semibold text-text">Mon QR</h2>
      <p class="mt-px text-[11.5px] text-muted">
        À présenter au comptoir. Il se renouvelle tout seul.
      </p>
    </div>
    <bfd-btn kind="ghost" size="sm" [disabled]="loading()" (clicked)="refresh()"
      >Rafraîchir</bfd-btn
    >
  </div>

  <div class="mt-3 flex justify-center">
    @if (dataUrl(); as src) {
      <img
        [src]="src"
        alt="QR d'identité"
        class="rounded-md bg-white p-2"
        width="220"
        height="220"
      />
    } @else if (loading()) {
      <p class="py-10 text-[12px] text-muted">Génération…</p>
    } @else if (error(); as message) {
      <p class="py-10 text-[12px] text-danger">{{ message }}</p>
    }
  </div>
</div>
