<header
  class="flex items-center gap-3 px-4 py-3.5 border-b border-border-s bg-bg shrink-0 md:gap-4 md:px-6"
>
  <button
    type="button"
    class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-md text-text-2 hover:bg-surface-2 md:hidden"
    aria-label="Ouvrir la navigation"
    (click)="menuClick.emit()"
  >
    <svg lucideMenu [size]="20" aria-hidden="true"></svg>
  </button>
  <div class="flex-1 min-w-0">
    @if (header(); as h) {
      @if (h.breadcrumb && h.breadcrumb.length) {
        <nav
          class="hidden items-center gap-1.5 text-[11px] text-muted mb-0.5 md:flex"
          aria-label="Fil d'Ariane"
        >
          @for (crumb of h.breadcrumb; track $index; let last = $last; let first = $first) {
            @if (!first) {
              <svg lucideChevronRight [size]="11" aria-hidden="true"></svg>
            }
            <span [class]="last ? 'text-text-2' : ''">{{ crumb }}</span>
          }
        </nav>
      }
      <div class="flex min-w-0 items-baseline gap-3">
        <h1
          class="m-0 truncate text-[17px] font-semibold -tracking-[0.3px] text-text md:text-[19px]"
        >
          {{ h.title }}
        </h1>
        @if (h.subtitle) {
          <!-- Masqué sous `md` : il entrait en collision avec les actions. -->
          <span class="hidden truncate text-xs text-muted md:inline">{{ h.subtitle }}</span>
        }
      </div>
    }
  </div>
  @if (actions(); as tpl) {
    <div class="flex shrink-0 items-center gap-2">
      <ng-container [ngTemplateOutlet]="tpl" />
    </div>
  }
  <span class="hidden w-px h-[22px] bg-border sm:block" aria-hidden="true"></span>
  <button
    type="button"
    (click)="theme.toggle()"
    class="hidden w-8 h-8 rounded-md border border-border bg-surface text-text-2 sm:inline-flex items-center justify-center cursor-pointer hover:bg-surface-2"
    [attr.aria-label]="themeTooltip()"
    [baeTooltip]="themeTooltip()"
    baeTooltipPlacement="bottom"
  >
    @if (theme.mode() === 'dark') {
      <svg lucideSun [size]="15" aria-hidden="true"></svg>
    } @else {
      <svg lucideMoon [size]="15" aria-hidden="true"></svg>
    }
  </button>
  <a
    routerLink="/notifications"
    class="relative w-8 h-8 rounded-md border border-border bg-surface text-text-2 inline-flex items-center justify-center cursor-pointer hover:bg-surface-2"
    aria-label="Notifications"
    baeTooltip="Notifications"
    baeTooltipDescription="3 nouvelles · cliquez pour ouvrir"
    baeTooltipPlacement="bottom-end"
  >
    <svg lucideBell [size]="15" aria-hidden="true"></svg>
    <span
      class="absolute top-1 right-1.5 w-1.5 h-1.5 rounded-full bg-red border-2 border-surface"
      aria-hidden="true"
    ></span>
  </a>
</header>
