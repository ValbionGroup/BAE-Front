<bfd-auth-card
  [icon]="icShield"
  heading="Vérification en deux étapes"
  [description]="description()"
>
  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="flex flex-col gap-3.5">
    @if (errorMessage(); as message) {
      <div
        class="flex items-start gap-2.5 rounded-md border border-danger bg-danger-soft px-3.5 py-3 text-[12.5px] text-danger"
        role="alert"
        aria-live="assertive"
        data-testid="two-factor-error"
      >
        <svg [lucideIcon]="icAlert" [size]="16" class="mt-0.5 shrink-0" aria-hidden="true"></svg>
        <span>{{ message }}</span>
      </div>
    }

    @if (useRecovery()) {
      <bae-field label="Code de secours" hint="Le code reçu à l'activation, tirets facultatifs.">
        <bae-input
          formControlName="recoveryCode"
          id="two-factor-recovery"
          type="text"
          placeholder="XXXXX-XXXXX"
          data-testid="recovery-code"
          [invalid]="errorMessage() !== null"
          [errorId]="errorMessage() !== null ? 'two-factor-error' : null"
        />
      </bae-field>
    } @else {
      <bae-field label="Code de vérification">
        <bae-otp-input
          formControlName="code"
          id="two-factor-code"
          ariaLabel="Code de vérification à 6 chiffres"
          [invalid]="errorMessage() !== null"
          [errorId]="errorMessage() !== null ? 'two-factor-error' : null"
          (completed)="onSubmit()"
        />
      </bae-field>
    }

    <bae-btn
      kind="primary"
      [full]="true"
      size="lg"
      type="submit"
      [disabled]="!submittable() || busy()"
    >
      {{ busy() ? 'Vérification…' : 'Vérifier' }}
    </bae-btn>
  </form>

  <p class="mt-4 mb-0 text-center">
    <button
      type="button"
      class="cursor-pointer border-none bg-transparent text-xs text-blue underline-offset-2 hover:underline"
      data-testid="toggle-recovery"
      (click)="toggleRecovery()"
    >
      {{ useRecovery() ? 'Utiliser mon application' : 'Utiliser un code de secours' }}
    </button>
  </p>

  <p class="mt-3 mb-0 text-center">
    <a [routerLink]="loginPath" class="text-xs text-muted hover:text-text">
      Recommencer la connexion
    </a>
  </p>
</bfd-auth-card>
