<ng-template #actions>
  <bfd-page-actions [actions]="pageActions()" />
</ng-template>

<div class="flex h-full flex-col md:grid md:grid-cols-[1fr_360px]">
  <!-- LEFT: Calendar -->
  <div class="flex min-w-0 flex-col p-3 md:p-5">
    <!-- Tabs + month nav -->
    <div class="mb-3.5 flex items-center">
      <!--<div class="inline-flex gap-px rounded-md border border-border bg-surface-2 p-0.5">
        @for (s of viewTabs; track s; let i = $index) {
          <button
            type="button"
            (click)="activeTab.set(i)"
            [class]="
              'rounded-sm border-none px-3.5 py-1 text-xs cursor-pointer ' +
              (i === activeTab() ? 'bg-surface text-text shadow-sm' : 'bg-transparent text-muted')
            "
          >
            {{ s }}
          </button>
        }
      </div>-->
      <div class="flex-1"></div>
      <bae-btn kind="ghost" size="sm" (clicked)="goToToday()">Aujourd'hui</bae-btn>
      <button
        (click)="previousMonth()"
        type="button"
        class="flex h-7.5 w-7.5 cursor-pointer items-center justify-center rounded-md border-none bg-transparent text-muted"
      >
        <svg [lucideIcon]="icChevronRight" [size]="14" class="rotate-180" aria-hidden="true"></svg>
      </button>
      <div class="px-2 text-[15px] font-semibold -tracking-[0.2px] text-text">
        {{ activeMonthDisplay() }}
      </div>
      <button
        (click)="nextMonth()"
        type="button"
        class="flex h-7.5 w-7.5 cursor-pointer items-center justify-center rounded-md border-none bg-transparent text-muted"
      >
        <svg [lucideIcon]="icChevronRight" [size]="14" aria-hidden="true"></svg>
      </button>
    </div>

    <!-- Weekday header -->
    <div class="grid grid-cols-7 border-l border-t border-border-s">
      @for (d of weekdays; track d) {
        <div
          class="border-b border-r border-border-s bg-surface px-1 py-1.5 text-center text-[10px] font-medium text-muted md:px-2.5 md:py-2 md:text-left md:text-[11px]"
        >
          {{ d }}
        </div>
      }
    </div>

    <!-- Days grid -->
    <div
      class="grid flex-1 grid-cols-7 auto-rows-fr border-t border-border-s md:border-l md:border-t-0"
    >
      @for (d of days(); track $index) {
        @let ev = eventFor(d);
        @let im = inMonth(d);
        <div
          class="flex min-h-[58px] flex-col gap-1 border-b border-r border-border-s p-0.5 md:min-h-[76px] md:p-1.5"
          [class.bg-surface]="!im"
          [class.opacity-50]="!im"
        >
          <div class="flex items-center gap-1">
            <span
              class="tnum inline-flex h-5 w-5 items-center justify-center rounded-full text-[10px] font-medium md:text-[11px]"
              [class]="isToday(d) ? 'bg-blue text-white' : im ? 'text-text-2' : 'text-muted'"
              >{{ d.getDate() }}</span
            >
          </div>
          @if (ev) {
            <div
              (click)="selectEventView(ev.id)"
              [class]="`flex flex-col gap-0.75 rounded-sm px-1 py-0.5 text-[9.5px] font-medium leading-snug cursor-pointer select-none md:px-1.5 md:py-1 md:text-[11px] ${getEventColor(ev)}`"
            >
              <span class="overflow-hidden text-ellipsis whitespace-nowrap">{{ ev.name }}</span>
              @if (isPresenceLoading(ev)) {
                <bae-skeleton width="56px" height="10px" />
              } @else {
                <span class="mono hidden text-[9.5px] opacity-85 md:inline">{{
                  respLabel(ev)
                }}</span>
              }
            </div>
          }
        </div>
      }
    </div>
  </div>

  <!-- RIGHT: Roster aside -->
  <bae-detail-sheet
    [open]="activeEventView() !== undefined"
    title="Feuille de présence"
    (closed)="selectEventView(undefined)"
  >
    <bfd-presences-roster-aside [eventId]="activeEventView()" />
  </bae-detail-sheet>
</div>
